    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; cursor: pointer;   /* none: 손가락이 살짝 떨려도 터치가 취소되지 않게 */
    --x: 0; --cap: 20px; --slc: #ff7f99; --slc: color-mix(in srgb, var(--hot) 74%, #fff);   /* 채움: 테마 색을 흰색에 조금 섞음 */
    --clk: #f2557a; --clk: color-mix(in srgb, var(--hot) 90%, #000);   /* 시계: 조금 더 진하게 */
  }
  .sl-end { flex: none; width: 34px; display: flex; align-items: center; font: 700 11px/1 var(--font-num); color: #a3a3ad; letter-spacing: .2px; }
  .ex-slider.from .sl-end.l, .ex-slider.max .sl-end.r { color: var(--hot); }   /* 맨 왼쪽 = FROM · 맨 오른쪽 = 2h */
  .sl-end.r { justify-content: flex-start; padding-left: 4px; }   /* "2h": 왼쪽 정렬 + 바에서 살짝 띄움 */
  .sl-end svg { display: none; }
  .sl-rail { position: relative; flex: 1 1 auto; height: 24px; }
  .sl-track {
    position: absolute; left: 0; right: 0; top: 50%; height: 10px; margin-top: -5px; background: #dcdce4; overflow: hidden;   /* 마름모 바: 조금 더 진하게 */
    -webkit-clip-path: polygon(0 50%, 6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%);
    clip-path: polygon(0 50%, 6px 0, calc(100% - 6px) 0, 100% 50%, calc(100% - 6px) 100%, 6px 100%);
  }
  .sl-fill { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--x) * (100% - var(--cap)) + var(--cap) / 2); background: var(--slc); transition: width .3s cubic-bezier(.2, .7, .2, 1); }
  .sl-cap {
    position: absolute; top: 50%; left: calc(var(--x) * (100% - var(--cap))); width: var(--cap); height: var(--cap); margin-top: calc(var(--cap) / -2);
    border-radius: 50%; background: #fff; color: var(--clk); pointer-events: none;
    box-shadow: 0 1px 3px rgba(30, 30, 60, .22), inset 0 0 0 1.8px var(--clk);
    display: flex; align-items: center; justify-content: center;
    transition: left .3s cubic-bezier(.2, .7, .2, 1), transform .15s;
  }
  .sl-cap svg { display: block; }
  /* 시계 바늘 1개: 10m 에서 12시 방향 → 2h 에서 한 바퀴(360°) */
  .sl-cap .hand { transform-origin: 10px 10px; transform: rotate(calc(var(--x) * 360deg)); transition: transform .3s cubic-bezier(.2, .7, .2, 1); }
  .ex-slider.drag .sl-cap .hand { transition: none; }
  .ex-slider.drag .sl-fill, .ex-slider.drag .sl-cap { transition: none; }
  .ex-slider.drag .sl-cap { transform: scale(1.12); }
  .ex-slider.holding .sl-track { background: #cfcfd8; }
  /* 잠김
     · 바(남은 부분): 옅은 회색 빗금 / 채움: 진한 회색에도 같은 사선 무늬
     · 채움은 넘친 만큼 한 겹씩 더 칠함 (lockLayers): 0~2h 연한 회색 → 2~4h 넘친 만큼 회색 → 4~12h 넘친 만큼 진한 회색 → 12h 넘으면 가장 진한 회색
     · 자물쇠는 바 가운데 고정, 흰 테두리로 어떤 색 위에서도 또렷하게 */
  .ex-slider.lock .sl-track { background: repeating-linear-gradient(135deg, #dadae1 0 4px, #e6e6eb 4px 8px); }
  .sl-f2, .sl-f3 { display: none; position: absolute; left: 0; top: 0; bottom: 0; }
  .ex-slider.lock .sl-fill, .ex-slider.lock .sl-f2, .ex-slider.lock .sl-f3 { display: block; transition: width .3s cubic-bezier(.2, .7, .2, 1); }
  .ex-slider.lock .sl-fill { width: calc(var(--l1) * 100%); background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .18) 0 4px, rgba(255, 255, 255, 0) 4px 8px), #b1b1bb; }
  .ex-slider.lock .sl-f2 { width: calc(var(--l2) * 100%); background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .15) 0 4px, rgba(255, 255, 255, 0) 4px 8px), #8b8b96; }
  .ex-slider.lock .sl-f3 { width: calc(var(--l3) * 100%); background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .12) 0 4px, rgba(255, 255, 255, 0) 4px 8px), #63636d; }
  .ex-slider.lock.lkmax .sl-f3 { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .1) 0 4px, rgba(255, 255, 255, 0) 4px 8px), #3a3a42; }
  .ex-slider.lock .sl-cap { display: none; }
  .ex-slider.lock .sl-end { visibility: hidden; }
  /* 자물쇠: 그림자 대신 흰 테두리 획 → 어떤 회색 위에서도 또렷 */
  .sl-lk { display: none; position: absolute; left: 50%; top: 50%; width: 18px; height: 20px; margin: -11px 0 0 -9px; pointer-events: none; }
  .sl-lk svg { display: block; width: 18px; height: 20px; }
  .ex-slider.lock .sl-lk { display: block; }
  .ex-slider.jiggle .sl-lk svg { animation: lockJiggle .4s; }
  @keyframes lockJiggle { 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(5deg); } }
  .ex-slider.off { opacity: .35; pointer-events: none; }
  .ex-slider.off .sl-fill, .ex-slider.off .sl-cap { display: none; }
  .ex-lenval { display: inline-flex; align-items: center; gap: 4px; padding: 6px 0 6px 10px; margin: -6px 0; font: 800 12.5px/1 var(--font-num); color: var(--hot); cursor: pointer; }   /* 눌러도 길이 바꾸기 */
  .ex-lenval.lock { color: #6b6b78; }

  /* ---------- 고르는 창: 일정 창 위 가운데 (살짝 커지며 나타남) ---------- */
  .popbg {
    position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(20, 20, 40, .3); overscroll-behavior: contain;
    visibility: hidden; opacity: 0; pointer-events: none; transition: opacity .22s ease, visibility 0s linear .25s;
    /* 시작 = 핑크 / 종료 = 진한 핑크 */
    --pa: var(--hot); --pa-soft: #ffe8ee; --pa-head: #ffeaef; --pa-dim: #f7b4c3; --pa-sh: rgba(255, 90, 122, .5);
  }
  .popbg[data-w="e"] { --pa: #c2335d; --pa-soft: #fbe2e9; --pa-head: #fbe4eb; --pa-dim: #e6a3b6; --pa-sh: rgba(194, 51, 93, .45); }
  .popbg.open { visibility: visible; opacity: 1; pointer-events: auto; transition: opacity .22s ease, visibility 0s; }
  .pop {
    width: 100%; max-width: 360px; background: #fff; border-radius: 22px; padding: 18px 14px 14px;
    box-shadow: 0 24px 48px -16px rgba(30, 30, 60, .4);
    transform: scale(.94) translateY(10px); transition: transform .28s cubic-bezier(.2, .7, .2, 1);
  }
  .popbg.open .pop { transform: none; }
  .pop-h { display: flex; align-items: center; min-height: 32px; margin: 0 4px 10px; }
  .pop-t { position: relative; padding-left: 12px; font: 700 19px/1.15 var(--font-title); color: var(--ink); }
  .pop-t::before { content: ''; position: absolute; left: 0; top: 1px; bottom: 1px; width: 4px; border-radius: 2px; background: var(--pa); }
  .pop-tag { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px; border-radius: 999px; background: var(--pa-soft); color: var(--pa); font: 700 12.5px/1 var(--font-body); }
  .pop-act { margin-top: 14px; }
  .pop-act button { height: 48px; padding: 0; border-radius: 14px; font: 700 16px var(--font-body); }
  .pop .b-save { background: var(--pa); }
  .popbg[data-k="date"] #popTime, .popbg[data-k="time"] #popDate { display: none; }

  /* 달력 (요일 줄 · 일요일/빨간 날 빨강) */
  .pk-nav { display: flex; align-items: center; gap: 6px; margin: 0 2px 8px; }
  .pk-title { margin-right: auto; display: flex; align-items: baseline; gap: 5px; font: 700 18px/1 var(--font-title); color: var(--ink); }
  .pk-year { font: 700 15px/1 var(--font-num); color: var(--sub); letter-spacing: .5px; margin-right: 3px; }
  .pk-arrow { width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background: var(--grey); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .pk-arrow:active { background: #e6e6ec; }
  .pk-cal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; --bg: var(--pa-soft); }
  .pk-head { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--pa-head); }
  .pk-head span { text-align: center; padding: 8px 0 7px; font: 700 13px var(--font-body); color: #3a3a44; }
  .pk-head .sun { color: #e51440; }
  .pk-grid { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 40px); }
  .pk-cal.slide-next .pk-grid { animation: pgNext .28s cubic-bezier(.2, .7, .2, 1); }
  .pk-cal.slide-prev .pk-grid { animation: pgPrev .28s cubic-bezier(.2, .7, .2, 1); }
  .pd { position: relative; min-width: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; }
  .pd::before { content: ''; position: absolute; top: 5px; bottom: 5px; left: 0; right: 0; }
  .pd.inr::before { background: var(--bg); }
  .pd.s.rng::before { left: 50%; background: var(--bg); }
  .pd.e.rng::before { right: 50%; background: var(--bg); }
  .pd .pn { position: relative; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 400 12.5px/1 var(--font-cal); color: var(--ink); transition: background .15s; }
  .pd.sun .pn { color: #e51440; }
  .pd .pn { -webkit-text-stroke: .5px var(--cbg, #fff); }                  /* 번지 살짝 얇게 (달력과 같은 방법) */
  .pd.inr .pn { --cbg: var(--bg); }
  .pd.s .pn, .pd.e .pn { --cbg: #fff; }
  .popbg[data-w="s"] .pd.s .pn, .popbg[data-w="e"] .pd.e .pn { --cbg: var(--pa); }
  .popbg[data-w="s"] .pd.e:not(.s) .pn { --cbg: #fde8ee; }
  .pd.old .pn { color: #c9c9d1; }                         /* 지난 날 (고를 수는 있음) */
  .pd.today .pn { color: #f08aa3; }                       /* 오늘: 동그라미 없이 옅은 분홍 숫자 */
  .pd.s .pn, .pd.e .pn { background: #fff; color: var(--pa); box-shadow: inset 0 0 0 1.5px var(--pa-dim); }
  .popbg[data-w="s"] .pd.s .pn, .popbg[data-w="e"] .pd.e .pn { background: var(--pa); color: #fff; box-shadow: 0 3px 8px -3px var(--pa-sh); }
  /* 시작 날짜 창: 뒤에 이어지는 기간은 아주 옅게 */
  .popbg[data-w="s"] .pk-cal { --bg: #fff5f8; }
  .popbg[data-w="s"] .pd.e:not(.s) .pn { background: #fde8ee; color: var(--ink); box-shadow: none; }
  .pd.just .pn { animation: pkPick .34s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pkPick { 0% { transform: scale(.5); } 100% { transform: scale(1); } }
  .pd:disabled { cursor: default; }
  .pd:disabled .pn { color: #e0e0e6; }
  .pd:not(:disabled):not(.s):not(.e):active .pn { background: var(--pa-soft); }

  /* 시간: 갤럭시 알람처럼 큰 숫자 휠 (오전·오후 / 시 / 분), 가운데 줄이 고른 값 */
  .wheel { position: relative; display: flex; height: 240px; padding: 0 8px; }
  .wheel .wsel { position: absolute; left: 0; right: 0; top: 96px; height: 48px; border-radius: 14px; background: var(--pa-soft); }
  .wcol {
    position: relative; flex: 1 1 0; min-width: 0; overflow-y: scroll; overflow-x: hidden; overscroll-behavior: contain; scroll-snap-type: y mandatory; touch-action: pan-y;
    padding: 96px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
    mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
  }
  .wcol::-webkit-scrollbar { display: none; }
  .wcol.ap { flex: 0 0 86px; }
  /* 휠 글자: 오전/오후 · 시 · 분 · 진행 시간 모두 세방고딕 400 18px + 0.3px 외곽선 · 고르면 색 + 글자만 1.15배 */
  .wi { height: 48px; display: flex; align-items: center; justify-content: center; scroll-snap-align: center; cursor: pointer;
    font: 400 18px/1 var(--font-title); color: #c4c4cc; -webkit-text-stroke: .3px currentColor; transition: color .15s; }
  .wi > span { display: inline-block; transition: transform .15s; will-change: transform; backface-visibility: hidden; }
  .wi.on { color: var(--pa); }
  .wi.on > span { transform: scale(1.15); }
  .wsep { position: relative; flex: 0 0 14px; align-self: center; text-align: center; padding-bottom: 1px;
    font: 400 21px/1 var(--font-title); -webkit-text-stroke: .3px currentColor; color: var(--pa); }
  @media (prefers-reduced-motion: reduce) { .pd.just .pn { animation: none; } .pop { transition: none; } }

  /* ---------- TIMELINE 오늘 카드: 테두리를 따라 빛이 도는 효과 (시골 펜션과 같은 방식) ----------
     테두리 선 위를 실제 길이(px)로 따라가서 가로·세로·모서리 어디서나 같은 속도 (ringCards)
     같은 색 선 여러 겹을 머리 위치만 맞추고 길이를 다르게 → 머리는 진하고 꼬리 끝은 0 으로 사라짐 */
  .daycard .ring { position: absolute; left: -2px; top: -2px; width: calc(100% + 4px); height: calc(100% + 4px); overflow: visible; pointer-events: none; }
  .daycard .ring rect { fill: none; stroke: #c8103f; stroke-width: 2; stroke-linecap: butt; }

  /* =============================================================
     연두·보라 날 (달력에서 꾹 누른 채 계속 → 지이잉 → 뾱 / 다시 꾹 → 원래대로)
     · 그날 화면 안의 분홍 포인트가 보라(주색) + 연두(띠 · 숨쉬기)로 바뀜
     · 꽉 찬 알약 · 버튼만 연두→보라 그라데이션, 나머지는 옅은 라벤더 · 연두 단색 → 촌스럽지 않게
     ============================================================= */
  body.theme-lv main, body.theme-lv .dbtn, body.theme-lv .sheetbg, body.theme-lv .popbg {
    --hot: #7a62e6; --pink: #a6d65a; --soft: #f1edff; --rose: #6550cf; --dotline: #c9bdf6;
  }
  body.theme-lv .tab.dbtn.active { background: var(--lvgrad); }
  body.theme-lv .hero-pill.hot { background: var(--lvgrad); }
  body.theme-lv .hero.hero-day::before { background: linear-gradient(180deg, #a6d65a, #7a62e6); }
  /* 일정 카드는 연두·보라 날에도 평소 색 그대로 (분홍 · 골드) */
  body.theme-lv .ev { --hot: #ff5a7a; --pink: #f7a0b2; --soft: #ffeef2; --rose: #c4506a; --dotline: #f2a9b9; }
  body.theme-lv .nowline > span { background: var(--lvgrad); box-shadow: 0 1px 4px rgba(122, 98, 230, .35); }
  body.theme-lv .daykey { box-shadow: 0 6px 9px -7px rgba(122, 98, 230, .2), 0 1px 2px rgba(0, 0, 0, .03); }
  body.theme-lv .daykey .thumb { background: #e4ddfb; }
  /* 일정 창 · 고르는 창 */
  body.theme-lv .pk-f .pk-v.tm { color: #6550cf; }
  body.theme-lv .ex-end .ev2 { color: #5b45c4; }
  body.theme-lv .ex-pair.end .pk-f.on { box-shadow: inset 0 0 0 1.5px #5b45c4; }
  body.theme-lv .ex-pair.end .pk-f.on .pk-l { color: #5b45c4; }
  body.theme-lv .sheet input.ename:focus, body.theme-lv .sheet textarea.etext:focus { box-shadow: 0 0 0 3px rgba(122, 98, 230, .14); }
  body.theme-lv .popbg { --pa: #7a62e6; --pa-soft: #efeaff; --pa-head: #f1edff; --pa-dim: #c4b6f4; --pa-sh: rgba(122, 98, 230, .45); }
  body.theme-lv .popbg[data-w="e"] { --pa: #5b45c4; --pa-soft: #e9e4fb; --pa-head: #ebe6fb; --pa-dim: #b3a6e6; --pa-sh: rgba(91, 69, 196, .45); }
  body.theme-lv .pd.today .pn { color: #a596ec; }
  /* 달력: 연두·보라 날 표시 (아주 옅은 연두→라벤더 칸 · 고르면 그라데이션) */
  /*  · 칸 바탕은 그대로 두고 숫자만 연두→보라 (다른 날짜와 어울리게) */
  .cday.lv .cmon { color: #6550cf; }
  .cday .lvt { background: linear-gradient(135deg, #5aa82a 10%, #6a4fe0 78%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  .cday.lv.sel { background: var(--lvgrad); }
  .cday.lv.sel .lvt { background: none; color: #fff; -webkit-text-fill-color: #fff; }
  .cday.lv.sel .cnum, .cday.lv.sel .cmon { color: #fff; }
  .cday.lv.today:not(.sel) .cmon { color: #7a62e6; }
  .cday.lv .hl { background: #d6ccfa; }
  .cday.lv.sel .hl { background: rgba(40, 20, 110, .28); }
  .cday.lv.today .cdots i { background: #7a62e6; }
  .cday.lv.sel .cdots i { background: #fff; }
  /* 달력: 꾹 누른 채 계속 → 지이잉(칸이 연두·보라로 차오르며 떨림) → 뾱 바뀜 */
  .cday.charging::before {
    content: ''; position: absolute; inset: 2px; border-radius: 11px; background: var(--lvgrad); pointer-events: none;
    animation: lvCharge var(--chg, .7s) linear forwards;
  }
  .cday.charging { animation: lvBuzz .09s linear infinite; }
  @keyframes lvCharge { from { transform: scale(.2); opacity: .12; } to { transform: scale(1); opacity: .5; } }
  @keyframes lvBuzz { 0%, 100% { transform: translate(0, 0) scale(.92); } 25% { transform: translate(.7px, -.4px) scale(.92); } 50% { transform: translate(-.6px, .5px) scale(.92); } 75% { transform: translate(.4px, .6px) scale(.92); } }
  .cday.lvpop { animation: cellPop .45s cubic-bezier(.3, 1.7, .5, 1); }
  @keyframes cellPop { 0% { transform: scale(.72); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .cday.charging, .cday.lvpop, .cday.charging::before { animation: none; } }
  /* 켜고 끌 때 날짜가 살짝 톡 */
  .hero-day.lvpop .hero-main { animation: lvPop .38s cubic-bezier(.3, 1.6, .5, 1); }
  .hero-day.compact.lvpop .hero-main { animation-name: lvPopC; }
  @keyframes lvPop { 0% { transform: scale(.94); } 100% { transform: scale(1); } }
  @keyframes lvPopC { 0% { transform: scale(.78); } 100% { transform: scale(.84); } }
  @media (prefers-reduced-motion: reduce) { .hero-day.lvpop .hero-main { animation: none; } body.theme-lv .ev.live .evcard { animation: none; } }

  /* TIMELINE: 날짜를 넘어가는 일정 — CONTINUED / OVERNIGHT 글자 대신 선이 이어짐
     · 전날에서 이어짐: 점 위로 카드 윗선 쪽에서 흐려지며 내려오는 선
     · 다음 날로 이어짐: 점 아래로 카드 아래 끝까지 흐려지며 내려가는 선 */
  .daycard .det .tl-in { position: absolute; left: 3px; top: -12px; width: 2px; height: 17px; border-radius: 1px; pointer-events: none; background: linear-gradient(rgba(255, 163, 184, 0), var(--tlline)); }
  .daycard .det.cont:last-child::before { display: block; bottom: -14px; background: linear-gradient(var(--tlline), rgba(255, 163, 184, 0)); }
  .daycard .det.done .tl-in { background: linear-gradient(rgba(251, 230, 236, 0), #fbe6ec); }
  .daycard .det.done.cont:last-child::before { background: linear-gradient(#fbe6ec, rgba(251, 230, 236, 0)); }
  .daycard.today .det .tl-in { background: linear-gradient(rgba(255, 255, 255, 0), #fff); }
  .daycard.today .det.cont:last-child::before { background: linear-gradient(#fff, rgba(255, 255, 255, 0)); }
  .daycard.today .det.done .tl-in { background: linear-gradient(rgba(255, 202, 214, 0), #ffcad6); }
  .daycard.today .det.done.cont:last-child::before { background: linear-gradient(#ffcad6, rgba(255, 202, 214, 0)); }

  /* 일요일 · 빨간 날: 위 날짜 버튼 (특별한 날처럼) */
  body.theme-red .tab.dbtn.active { background: linear-gradient(120deg, #ff4a68 0%, #e51440 100%); }
  /* 오늘이 아닌 보통 날: 위 날짜 버튼은 옅은 분홍 (오늘 = 진한 분홍 · 특별한 날 = 연두·보라 · 일요일 = 빨강) */
  body.theme-plain .tab.dbtn.active { background: linear-gradient(120deg, #ffa9bc 0%, #ff92aa 100%); }
  /* 화살표: 넘어갈 날 미리 보기 */
  .arrow.a-red { color: #e51440; }   /* 일요일 · 빨간 날: 화살표만 빨갛게 (바탕은 그대로) */
  .arrow.a-lv { background: linear-gradient(135deg, #d6efa8 0%, #cfc2ff 100%); color: #4f3bb8; }   /* 특별한 날: 바탕을 또렷하게 (테두리 없이) */

  /* 삭제 대기중: 서버에서 지워졌다고 확인될 때까지 카드는 남겨 두고 회색 빗금 + "삭제 대기중" (확인되면 사라짐 · 실패하면 원래대로) */
  .ev.delwait { cursor: default; }
  .ev.delwait .evcard { background: repeating-linear-gradient(135deg, #f1f1f4 0 6px, #e8e8ed 6px 12px) !important; border-color: #d4d4db !important; box-shadow: none !important; }
  .ev.delwait .evcard::before, .ev.delwait .evcard::after, .ev.delwait::before { display: none !important; }
  .ev.delwait::after { background: #c9c9d1 !important; }
  .ev.delwait .elab, .ev.delwait .star { opacity: .45; }
  .ev.delwait .evname { color: #a3a3ad !important; text-decoration: line-through; border-left-color: #d4d4db !important; }
  .dwait { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; background: #fff; color: #e0344f;
    box-shadow: inset 0 0 0 1px #f6c9d1; font: 700 10.5px/1.3 var(--font-body); white-space: nowrap; }
  .dwait i { width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid #f6c9d1; border-top-color: #e0344f; animation: spin .8s linear infinite; }
  .det.delwait { opacity: .45; }
  .det.delwait .dn { text-decoration: line-through; }
  .det.delwait .dt::after { content: '삭제 대기중'; margin-left: 2px; padding: 1px 7px; border-radius: 999px; background: #fff; color: #e0344f; font: 700 10px/1.4 var(--font-body); }

  /* 메모 칩으로 찾아온 메모지: 살짝 톡 */
  .memo.flash { animation: memoFlash .55s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes memoFlash { 0% { transform: rotate(var(--rot)) scale(1); } 40% { transform: rotate(0deg) scale(1.07); } 100% { transform: rotate(var(--rot)) scale(1); } }

  @media (prefers-reduced-motion: reduce) { .ev.delwait .dwait i { animation: none; } }

  /* 앱 키 입력 창 (처음 한 번 · 키가 바뀌었을 때) */
  .keybg { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(20, 20, 40, .35); }
  .keybg.open { display: flex; }
  .keybox { width: 100%; max-width: 360px; padding: 22px 18px 18px; border-radius: 22px; background: #fff; text-align: center; box-shadow: 0 24px 50px -18px rgba(20, 20, 40, .45); }
  .keybox img { width: 64px; height: 64px; border-radius: 16px; }
  .keybox b { display: block; margin-top: 12px; font: 800 17px var(--font-body); color: var(--ink); }
  .keybox p { margin: 6px 0 14px; font: 500 13px/1.55 var(--font-body); color: var(--sub); }
  .keybox input { width: 100%; height: 48px; padding: 0 12px; border: 1px solid #e3e3e9; border-radius: 12px; outline: none; background: #f8f8fa;
    font: 600 15px monospace; color: var(--ink); text-align: center; }
  .keybox input:focus { border-color: var(--hot); background: #fff; }
  .keybox button { width: 100%; height: 48px; margin-top: 10px; border: 0; border-radius: 12px; background: var(--hot); color: #fff; font: 700 15px var(--font-body); }
  .keybox .kerr { min-height: 18px; margin-top: 8px; font: 600 12px var(--font-body); color: #e51440; }
</style>
</head>
<body>
  <header><div class="tabs" id="tabs"></div><div class="cal" id="cal"></div></header>
  <main id="main"><div class="loading">LOADING…</div></main>
  <!-- 넓은 화면: 앱을 왼쪽 · 오른쪽으로 옮기는 손잡이 -->
  <button class="mvh l" id="mvL" aria-label="앱을 왼쪽으로"><span class="grip"></span><svg viewBox="0 0 22 18" width="22" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="2" width="8.5" height="14" rx="2.2"/><path d="M15.5 13.2h1.5"/><path d="M9 9H1.8M4.6 6.2L1.8 9l2.8 2.8"/></svg></button>
  <button class="mvh r" id="mvR" aria-label="앱을 오른쪽으로"><span class="grip"></span><svg viewBox="0 0 22 18" width="22" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2" width="8.5" height="14" rx="2.2"/><path d="M5 13.2h1.5"/><path d="M13 9h7.2M17.4 6.2L20.2 9l-2.8 2.8"/></svg></button>

  <!-- 일정 편집: 이름 → 종류 → [시작 날짜 | 시작 시간] → [종료 날짜 | 종료 시간] → 길이 버튼
       날짜·시간 칸을 누르면 위에 달력 / 시간 휠 창이 열림 -->
  <div class="sheetbg" id="sheetbg">
    <div class="sheet esheet">
      <div class="sheet-tint"></div>

        <h3 id="edTitle">일정 추가</h3>

        <button class="esx" id="edClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
      <input type="text" id="edName" class="ename" placeholder="일정 이름" autocomplete="off">
      <div class="ex-lab">종류</div>
      <div class="ex-seg" id="exKind"></div>
      <div class="ex-lab">시간<span class="ex-note" id="exNote"></span></div>
      <div class="ex-row">
        <div class="ex-pair" id="exStart"></div>
        <span class="ex-arrow"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
        <div class="ex-end" id="exEnd"></div>
      </div>
      <div class="ex-lab">진행 시간<span class="ex-lenval" id="exLenVal"></span></div>
      <div class="ex-slider" id="exLens"></div>
      <div class="actions eactions">
        <button class="b-trash" id="edDel" aria-label="휴지통을 3초 꾹 누르면 삭제"><i class="tfill"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="lid"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7"/></g><path d="M6.2 6.5l.9 12.4a1.8 1.8 0 0 0 1.8 1.6h6.2a1.8 1.8 0 0 0 1.8-1.6l.9-12.4"/><path d="M10.2 10.5v6M13.8 10.5v6"/></svg></button>
        <button class="b-save" id="edSave">저장</button>
      </div>

  <!-- 날짜 / 시간 고르는 창 (일정 창 위에 뜸) -->
  <div class="popbg" id="popbg">
    <div class="pop">
      <div class="pop-h"><span class="pop-t" id="popT">시작 날짜</span><span class="pop-tag" id="popTag"></span></div>
      <div id="popDate"><div id="pkCal"></div></div>
      <div id="popTime"><div class="wheel" id="pkWheel"></div></div>
      <div class="actions pop-act">
        <button class="b-cancel" id="popCancel">취소</button>
        <button class="b-save" id="popOk">확인</button>
      </div>
    </div>
  </div>

  <!-- 메모 편집 -->
  <div class="sheetbg" id="memobg">
    <div class="sheet esheet">
      <div class="sheet-tint"></div>
      <div class="eshead">
        <h3 id="mmTitle">메모 추가</h3>
        <span class="esmod" id="mmMod"><span class="esn" id="mmSub"></span><span class="ess" id="mmSs"></span></span>
        <button class="esx" id="mmClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
      </div>
      <textarea id="mmText" class="etext" placeholder="메모를 적어 주세요"></textarea>
      <div class="actions eactions">
        <button class="b-trash" id="mmDel" aria-label="휴지통을 3초 꾹 누르면 삭제"><i class="tfill"></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="lid"><path d="M4 6.5h16"/><path d="M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7"/></g><path d="M6.2 6.5l.9 12.4a1.8 1.8 0 0 0 1.8 1.6h6.2a1.8 1.8 0 0 0 1.8-1.6l.9-12.4"/><path d="M10.2 10.5v6M13.8 10.5v6"/></svg></button>
        <button class="b-save" id="mmSave">저장</button>

  <div class="toast" id="toast"></div>

  <div class="keybg" id="keybg">

      <img src="icon-192.png" alt="">
      <b id="keyT">앱 키를 넣어 주세요</b>
      <p id="keyP">구글 시트 메뉴 <strong>[RUNDOWN] → 앱 키 보기</strong>에<br>나오는 키를 복사해서 붙여 넣으세요.</p>
      <input id="keyIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="앱 키 32자리">
      <button id="keyOk">시작하기</button>
      <div class="kerr" id="keyErr"></div>
    </div>
  </div>

<script>
  // =============================================================
  // 서버 연결: Apps Script 웹앱(API)에 { key, fn, args } 를 보내고 결과를 받음
  //  · 예전 google.script.run 과 똑같은 모양으로 쓰게 만들어 둠 → 아래 코드는 그대로
  //    google.script.run.withSuccessHandler(f).withFailureHandler(g).getAll(since)
  //  · 본문을 글자(text/plain)로 보내서 브라우저의 사전 확인 요청 없이 바로 감
  // =============================================================
  var KEY_STORE = "timeline_key";
  function apiKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
  function apiReady() { return /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL); }
  function authErr(msg) { var e = new Error(msg); e.auth = true; return e; }
  function callApi(fn, args) {
    if (!apiReady()) return Promise.reject(authErr("index.html 맨 위 API_URL 에 웹앱 주소를 넣어 주세요."));
    if (!apiKey()) return Promise.reject(authErr(""));
    return fetch(API_URL, { method: "POST", redirect: "follow", body: JSON.stringify({ key: apiKey(), fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error("서버 응답 " + r.status); return r.json(); })
      .then(function (res) {
        if (!res || !res.ok) throw res && res.auth ? authErr(res.error) : new Error((res && res.error) || "서버 오류");
        return res.data;
      })
      .catch(function (err) { if (err && err.auth) askKey(err.message); throw err; });
  }
  var google = { script: {} };
  Object.defineProperty(google.script, "run", {
    get: function () {                                     // 부를 때마다 새 연결 (성공 · 실패 처리를 따로 기억)
      var ok = function () {}, no = function (e) { console.warn("[TIMELINE]", e); };
      var p = new Proxy({}, {
        get: function (t, name) {
          if (name === "withSuccessHandler") return function (f) { ok = f; return p; };
          if (name === "withFailureHandler") return function (f) { no = f; return p; };
          return function () { callApi(name, [].slice.call(arguments)).then(function (d) { ok(d); }, function (e) { no(e); }); };
        }
      });
      return p;
    }
  });

  // 앱 키 입력 창
  function askKey(msg) {
    var bg = document.getElementById("keybg");
    if (!apiReady()) {
      document.getElementById("keyT").textContent = "웹앱 주소를 넣어 주세요";
      document.getElementById("keyP").innerHTML = "GitHub 의 index.html 맨 위 <strong>API_URL</strong> 에<br>/exec 로 끝나는 주소를 붙여 넣으세요.";
      document.getElementById("keyIn").style.display = document.getElementById("keyOk").style.display = "none";
    }
    document.getElementById("keyErr").textContent = msg || "";
    bg.classList.add("open");
  }
  document.getElementById("keyOk").addEventListener("click", function () {
    var k = document.getElementById("keyIn").value.replace(/\s+/g, "");
    if (!/^[0-9a-f]{32}$/i.test(k)) { document.getElementById("keyErr").textContent = "키는 32자리예요. 다시 복사해 주세요."; return; }
    try { localStorage.setItem(KEY_STORE, k); } catch (e) {}
    document.getElementById("keybg").classList.remove("open");
    load(true);

    }).join("") + "</div>";
  }

  // ---------- 날짜 화면 ----------
  function nowLineHtml(topCss) {

  // 그날의 핵심 일정 (TIMELINE 표에서 VIEW 체크된 것) — 없으면 아무것도 안 그림
  function dayKeysHtml(key) {

  // 칩을 누르면 그 자리로 빠르게 스크롤 (처음 빠르고 끝에서 살짝 부드럽게, 거리에 따라 0.17 ~ 0.34초)
  function quickScrollTo(y, done) {
    var y0 = window.scrollY, dy = y - y0;
    cancelAnimationFrame(quickScrollTo._r);
    if (Math.abs(dy) < 2) { if (done) done(); return; }
    var dur = Math.max(170, Math.min(345, Math.abs(dy) * .26)), t0 = null;
    (function step(t) {
      if (t0 === null) t0 = t;
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);

    })(performance.now());
  }
  function fastScrollTop() { quickScrollTo(0); }
  // 메모 칩 · +N → 메모지가 날짜 바로 아래에 보이는 자리로 스크롤하고, 누른 메모지를 살짝 톡 튀게
  function scrollToMemo(slot) {
    var memo = document.querySelector('#main .memos .memo[data-memo="' + slot + '"]') || document.querySelector("#main .memos");
    if (!memo) { fastScrollTop(); return; }
    var box = memo.closest(".memos") || memo, hd = document.querySelector("header");
    var y = box.getBoundingClientRect().top + window.scrollY - (hd ? hd.offsetHeight : 0) - heroGeo.stuck - 14;
    quickScrollTo(Math.max(0, y), function () {
      if (!slot) return;
      var el = document.querySelector('#main .memos .memo[data-memo="' + slot + '"]');
      if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
    });
  }

  // 메모지 기울기: 날짜 + 칸 번호로 정해지는 -2.2° ~ 2.2° (날짜마다 다르게, 같은 날짜는 언제 봐도 같게)
  function memoRot(key, slot) {
    var str = key + "#" + slot, h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }   // 글자가 하나만 달라도 값이 크게 달라지게 섞음
    h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
    var r = (((h >>> 0) % 45) - 22) / 10;
    return Math.abs(r) < .4 ? (r < 0 ? -.6 : .6) : r;          // 너무 반듯한 건 살짝 기울임
  }
  // 날짜 옆 작은 칩이 칸에 다 안 들어가면: 핵심 일정은 그대로, 메모는 들어가는 만큼만 → 나머지는 +N (누르면 맨 위로)
  function fitMinis(hero, box) {
    box = box || hero.querySelector(".hero-minis");
    if (!box) return;
    var old = box.querySelector(".more");
    if (old) old.remove();
    var chips = [].slice.call(box.querySelectorAll(".mini"));
    chips.forEach(function (c) { c.style.display = ""; });
    var avail = box.clientWidth, GAP = 5, MORE_W = 32, used = 0, hidden = 0;
    chips.forEach(function (c, i) {
      var w = c.offsetWidth, add = (used ? GAP : 0) + w;
      if (!c.classList.contains("mm")) { used += add; return; }
      var restMemo = chips.slice(i + 1).some(function (x) { return x.classList.contains("mm"); });
      if (hidden || used + add + (restMemo ? GAP + MORE_W : 0) > avail) { c.style.display = "none"; hidden++; }
      else used += add;
    });
    if (hidden) box.insertAdjacentHTML("beforeend", '<button class="mini more">+' + hidden + "</button>");
  }

  // 날짜 옆 작은 칩: 핵심 일정 + 아직 안 끝낸 메모 (위에 고정되던 것과 같은 것들)
  function miniHtml(key) {
    var ms = keyMs(key), h = "";
    state.all.events.filter(function (e) { return e.view && e.time === ms; }).forEach(function (e) {
      h += '<button class="mini mk"><i></i><span>' + esc(e.title) + "</span></button>";

        h += '<button class="mini mm" data-mslot="' + m.slot + '" style="--rot:' + (memoRot(key, m.slot) * .8).toFixed(2) + 'deg"><span>' + esc(String(m.text).trim().split("\n")[0]) + "</span></button>";
      });

  }

  function memosHtml(key) {
    var list = state.all.memos.filter(function (m) { return m.date === key; });
    var h = '<div class="memos">';
    for (var s = 1; s <= MEMO_SLOTS; s++) {
      var m = list.filter(function (x) { return x.slot === s; })[0];

        '<div class="mtext">' + (txt ? esc(txt) : "+") + "</div>" + (m && m.saving ? '<span class="msv"><i></i>저장 중</span>' : "") + "</div>";

  var ICON_NEXTDAY = '<svg class="nxd" viewBox="0 0 12 12" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-label="다음 날"><path d="M2.2 9.5V6.6a3.1 3.1 0 0 1 3.1-3.1h4.2"/><path d="M7.6 1.4l2.1 2.1-2.1 2.1"/></svg>';
  // 일정 카드 하나 (grid: 분 단위 위치 / list: 차례대로)
  function cardHtml(g, isToday, nm, list) {
    var e = g.ev, kind = e.kind;
    var mark = kind === "norm" ? (e.mark || "") : "";   // 중요(imp) / 미정(tbd)
    var past = isToday && g.le <= nm;                       // FROM · UNTIL 도 TIMELINE 과 같은 기준

    var one = !list && mins < 60; // 요약 화면은 길이와 상관없이 모두 1시간 모양, 시간표는 1시간 미만만 한 줄
    var narrow = !list && g.n > 1 && g.col > 0;

    var sweep = "--sw:" + ((height + 110) / 90 / .92).toFixed(2) + "s;";

      else pos += "left:calc(var(--gut) + (100% - var(--gut)) * " + g.col + " / " + g.n + ");width:calc((100% - var(--gut)) / " + g.n + " - 2px)";
    }

    // 왼쪽 시간 표시 + 카드 안 시간 줄 (첫 번째 열 카드만)
    var labels = "";

      labels += '<div class="elab first"><span class="elt">' + fmtMinAmPm(g.s) + "</span></div>";
      if (!list) {

        }

    // 다음 날로 넘어가는 일정: 끝 시간 앞에 "다음 날로" 심볼 (OVERNIGHT · CONTINUED 글자는 없음)
    var pills = (narrow ? '<span class="tm">' + fmtMinAmPm(g.s) + "</span>" : "") + (e.delPending ? '<span class="dwait"><i></i>삭제 대기중</span>' : "") + (e.saving ? '<span class="dwait sv"><i></i>저장 중</span>' : "") + (e.delPending ? "" : kind === "norm"
      ? '<span class="endpill">' + (g.cont ? ICON_NEXTDAY : "- ") + g.endAmPm + "</span>"
      : '<span class="dur d-' + kind + '">' + kindLabel(kind) + "</span>") +

      ? pills + '<span class="evname">' + nm2 + "</span>"
      : '<div class="evtime">' + pills + '</div><div class="evname">' + nm2 + "</div>";

    var tail = "";
    if (!list && kind === "in") {
      if (g.tail > 0) {
        var tl = "";
        for (var t2 = Math.ceil(g.ve / 60) * 60; t2 < g.ve + g.tail; t2 += 60) {
          var o2 = (t2 - g.ve) / 30 * SLOT;
          tl += '<div class="eline" style="top:' + (o2 - 1) + 'px"></div><div class="elab" style="top:' + (o2 + 6) + 'px">' + fmtMinAmPm(t2) + "</div>";

      }
      if (g.short) tail += '<i class="fromcut"></i>';

    return '<div class="ev k-' + kind + (g.tail > 0 && tail ? " hastail" : "") + (mark ? " m-" + mark : "") + (one ? " one" : "") + (narrow ? " narrow" : "") + (past ? " past" : "") + (live ? " live" : "") + (e.delPending ? " delwait" : "") + (e.saving ? " saving" : "") +
      (list ? " static" : "") + '" style="' + pos + '" data-edit="' + e.id + '">' +
      '<div class="evcard">' + (mark === "imp" ? '<span class="star evstar"></span>' : "") + labels + '<div class="evbody">' + body + "</div></div>" + tail + "</div>";
  }

  function renderDay(key) {
    $("main").innerHTML = dayHeroHtml(key, heroAnim()) + dayBodyHtml(key);
  }

  // 날짜 화면 위 날짜 (an: 그어지는 효과 — 옆으로 끌다 취소했을 때는 그어지지 않은 그대로 다시 씀)
  function dayHeroHtml(key, an) {
    var isToday = key === todayKey();
    var dp = dateParts(keyMs(key));

    var red = isRed(key), lv = isLv(key);

    var y1 = heroDateSvg(ty1, { h: 15, red: red, lv: lv, draw: an.draw, t: an.t, d0: 0, anim: mk.y1, uniform: HD_CHAR_MS, seq: HD_STEP_MS });
    var y2 = heroDateSvg(ty2, { h: 30, red: red, lv: lv, draw: an.draw, t: an.t, d0: 0, anim: mk.y2, uniform: HD_CHAR_MS, seq: HD_STEP_MS });   // 두 줄이 동시에 그어지기 시작

    var h = '<div class="hero hero-stroke hero-day' + (state.heroCompact ? " compact" : "") + (state.lvPop === key ? " lvpop" : "") + (state.heroMinis ? " minis" : "") + '">' + y1.svg +

    return h;

  // 날짜 화면 본문 (위 날짜 아래: 핵심 일정 · 메모 · 시간표) — 옆으로 끌 때 옆 날짜 미리 보기에도 같이 씀
  function dayBodyHtml(key) {
    var isToday = key === todayKey();

    var anyMemo = state.all.memos.some(function (m) { return m.date === key && String(m.text).trim() !== "" && !m.done; });
    if (anyMemo) h += '<div class="pinned">' + keysH + memosHtml(key) + "</div>";
    else {
      // 회색 메모만 있으면 요약하기 화면에서도 보여 줌 (다시 꾹 눌러 되돌릴 수 있게)
      var anyWritten = state.all.memos.some(function (m) { return m.date === key && String(m.text).trim() !== ""; });
      h += (keysH ? '<div class="pinned">' + keysH + "</div>" : "") + (state.hideEmpty && !anyWritten ? "" : memosHtml(key));

          '<div class="gut">' + (i % 2 === 0 ? fmtMinAmPm(i * 30) : "") + "</div></div>";
      }
      g += '<div class="ovl">';
      segs.forEach(function (sg) { g += cardHtml(sg, isToday, nm, false); });
      g += "</div>";

  // ---------- 메모 꾹 누르기 → 완료(회색) 켜고 끄기 ----------
  var press = { t: null, el: null, fired: false, x: 0, y: 0 };
  function pressStart(e) {
    var el = e.target.closest && e.target.closest(".memo:not(.empty)");
    if (!el || state.view === "TIMELINE") return;
    var pt = e.touches ? e.touches[0] : e;
    press.el = el; press.fired = false; press.x = pt.clientX; press.y = pt.clientY;
    el.classList.add("pressing");
    clearTimeout(press.t);
    press.t = setTimeout(function () {
      press.fired = true;
      el.classList.remove("pressing");
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
      toggleMemoDone(Number(el.getAttribute("data-memo")));
    }, 500);
  }
  function pressCancel() {
    clearTimeout(press.t);
    if (press.el) press.el.classList.remove("pressing");
    press.el = null;
  }
  function pressMove(e) {
    if (!press.el) return;
    var pt = e.touches ? e.touches[0] : e;

  $("main").addEventListener("mousemove", pressMove);
  $("main").addEventListener("mouseup", pressCancel);

  $("main").addEventListener("contextmenu", function (e) { if (e.target.closest(".memo")) e.preventDefault(); });

  // ---------- 날짜 화면 옆으로 넘기기 (달력 넘기기와 같은 방식) ----------
  //  · 누른 채 좌우로 끌면 본문(핵심 일정 · 메모 · 시간표)이 손가락을 그대로 따라 움직이고, 옆 날짜 본문이 나란히 붙어 들어옴
  //  · 위 날짜(2026 · 11. 20 · 요일)는 제자리 — 끄는 만큼 바뀐 숫자만 흐려지며 사라지고 새 숫자가 그어짐 (달력 제목처럼 앞뒤로 돌릴 수 있음)
  //  · 왼쪽으로 끌어 놓으면 다음 날 (끝없이) / 오른쪽으로 → 이전 날 (오늘까지 — 더 앞은 고무줄처럼 살짝만 끌리고 돌아옴)
  //  · 화면 폭의 22% 넘게 끌었거나 빠르게 휙 넘기면 넘어가고, 아니면 제자리로 돌아감
  //  · 옆 날짜는 지금 보던 시각과 같은 높이에 맞춰 둠 → 넘어간 뒤에도 보던 시각 그대로 (화살표로 넘길 때와 같은 자리)
  var daySwipe = null, daySwipeT = 0, daySwipeAnim = false;
  var DAY_GAP = 0;                                                   // 페이지 사이 간격: 본문 좌우 여백(16px씩)이 이미 있어서 따로 두지 않음
  // 움직일 것: 지금 날짜 본문 (위 날짜 · 옆 날짜 미리 보기는 빼고) — 고정 칸(.pinned)도 통째로
  function dayMovers() { return $("main").querySelectorAll("#main > :not(.hero):not(.day-ghost)"); }
  function dayW() { return ($("main").clientWidth || 360) + DAY_GAP; }
  // 지금 날짜는 dx 만큼, 옆 날짜는 그 옆(side: 1 = 오른쪽 · -1 = 왼쪽)에 붙어서 같이 움직임
  function daySet(dx, tr) {

  function dayCanSwipe() {
    return state.all && state.view !== "TIMELINE" && !state.calOpen && !state.edit && !state.memo &&
      !document.body.hasAttribute("data-lock") && !daySwipeAnim;
  }

  // 옆 날짜 미리 보기 만들기
  //  · 시간표가 위 고정 영역 밑으로 들어가 있으면: 시간표 줄을 지금 시간표와 같은 높이에 맞춤 (같은 시각이 같은 자리)
  //  · 아직 맨 위 근처면: 본문 시작(위 날짜 바로 아래)을 맞춤
  function dayGhostMake(key, side) {
    dayGhostDrop();
    var m = $("main"), g = document.createElement("div");
    g.className = "day-ghost";

    $("popbg").classList.remove("open");
    if (ed && ed.killing) killHide(bg, sh);                    // 삭제: 창은 바로 숨기고 카드에서 DELETED 연출
    // 카드에서 펼쳐진 창은 그 카드 자리로 다시 접히며 닫힘 (카드가 없으면 살짝 내려가며 사라짐)
    else if (bg.classList.contains("flip") && bg.classList.contains("open")) foldTo(ed && ed.id ? document.querySelector('#main [data-edit="' + ed.id + '"]') : null, bg, sh);
    bg.classList.remove("open");
    state.edit = null;
    lockScroll(false);
  }

  // ---------- 일정 수정 창: 카드에서 촥 펼쳐지기 / 접히기 ----------
  //  · 창은 원래 자리(화면 아래)에 그대로 두고, 처음엔 카드 크기 · 위치만큼만 보이게 잘라 둔 뒤(clip-path) 한 번에 펼침
  //  · 바탕색도 카드 색 → 흰색으로, 안의 내용은 펼쳐지는 중간부터 나타남
  var SHEET_STILL = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function sheetAnimStop(sh) {
    if (sh.getAnimations) sh.getAnimations({ subtree: true }).forEach(function (a) { a.cancel(); });
    var bg = sh.parentNode;
    if (bg.classList.contains("flip") && !bg.classList.contains("open")) {   // 접히던 중이었으면 원래 상태로
      // 뒤 어두운 막이 잠깐 다시 진해졌다 사라지며 깜빡이지 않게: 전환 효과 없이 바로 숨은 상태로
      sh.style.transition = bg.style.transition = "none";
      bg.classList.remove("flip");
      void bg.offsetWidth;
      sh.style.transition = bg.style.transition = "";
    }
  }
  // 열기 (0.4초): 누른 카드 크기 · 자리에서 창 크기로 한 번에 쫙 커지며 펼쳐짐 (끝에서 아주 살짝 지나쳤다 돌아옴)
  //  · 카드 색 막이 덮여 있다가 걷히고, 안의 내용은 위에서부터 차례로 나타남 / 카드는 창이 열려 있는 동안 숨김
  //  · 위치 · 크기(transform)와 투명도만 움직임 → 휴대폰에서도 버벅이지 않음
  var flipSrc = null;
  function cardFrom(src, sh) {
    var card = src.querySelector(".evcard") || src, r = card.getBoundingClientRect(), s = sh.getBoundingClientRect();
    var col = getComputedStyle(card).backgroundColor;
    if (!col || col === "rgba(0, 0, 0, 0)" || col === "transparent") col = getComputedStyle(document.querySelector("main")).getPropertyValue("--soft").trim() || "#ffeef2";
    return {
      t: "translate(" + (r.left - s.left).toFixed(1) + "px, " + (r.top - s.top).toFixed(1) + "px) scale(" +
        Math.max(.05, r.width / s.width).toFixed(4) + ", " + Math.max(.04, r.height / s.height).toFixed(4) + ")",
      col: col
    };
  }
  function sheetKids(sh) { return [].filter.call(sh.children, function (c) { return !c.classList.contains("sheet-tint"); }); }
  function unfoldFrom(src, bg, sh) {
    if (SHEET_STILL || !sh.animate) return false;
    bg.classList.add("flip", "open");                          // 창은 바로 제자리 (아래에서 올라오지 않음)
    var f = cardFrom(src, sh), tint = sh.querySelector(".sheet-tint");
    sh.style.transformOrigin = "0 0";
    sh.animate([{ transform: f.t }, { transform: "none" }], { duration: 400, easing: "cubic-bezier(.2, .9, .3, 1.04)" });
    tint.style.background = f.col;
    tint.animate([{ opacity: 1 }, { opacity: 1, offset: .3 }, { opacity: 0 }], { duration: 400, easing: "ease-out", fill: "forwards" });
    sheetKids(sh).forEach(function (c, i) {
      c.animate([{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
        { duration: 240, delay: 150 + i * 28, easing: "cubic-bezier(.2, .8, .2, 1)", fill: "backwards" });
    });
    flipSrc = src;
    src.style.visibility = "hidden";
    return true;
  }
  // 닫기: 거꾸로 — 창이 카드 자리 · 크기로 쏙 줄어들며 카드 색으로 (카드가 없으면 살짝 내려가며 사라짐)
  function foldTo(src, bg, sh) {
    var hidden = flipSrc; flipSrc = null;
    function show() { if (hidden) hidden.style.visibility = ""; if (src) src.style.visibility = ""; }
    if (!sh.animate) { show(); return; }
    var tint = sh.querySelector(".sheet-tint"), a;
    if (src) {
      src.style.visibility = "hidden";
      var f = cardFrom(src, sh);
      a = sh.animate([{ transform: "none" }, { transform: f.t }], { duration: 280, easing: "cubic-bezier(.5, 0, .3, 1)", fill: "forwards" });
      tint.style.background = f.col;
      tint.animate([{ opacity: 0 }, { opacity: 1, offset: .6 }, { opacity: 1 }], { duration: 280, fill: "forwards" });
    } else a = sh.animate([{ transform: "none", opacity: 1 }, { transform: "translateY(40px)", opacity: 0 }], { duration: 260, easing: "ease-in", fill: "forwards" });
    sheetKids(sh).forEach(function (c) { c.animate([{ opacity: 1 }, { opacity: 0, offset: .4 }, { opacity: 0 }], { duration: 280, fill: "forwards" }); });
    a.onfinish = function () { show(); if (!bg.classList.contains("open")) sheetAnimStop(sh); };
  }
  function setBusy(b) { if (state.edit) state.edit.busy = b; $("edDel").disabled = b; updateSaveState(); }

  $("edClose").onclick = function () { if (state.edit && state.edit.killing) return; closeSheet(); };
  $("sheetbg").addEventListener("click", function (e) {
    if (e.target !== $("sheetbg") || (state.edit && state.edit.killing)) return;
    closeSheet();
  });
  $("edSave").onclick = function () { if (!this.disabled) submit(state.edit.mode); };

  // ---------- 삭제: 휴지통을 3초 꾹 (일정 · 메모 같은 방식) ----------
  //  · 누르는 동안: 휴지통에 빨강이 차오르고 · 진동이 점점 세지고 · 창이 점점 세게 흔들리며 색이 빠짐
  //  · 3초 전에 떼면: "꾹 눌러야 삭제돼요" 알림 / 3초를 채우면: 창이 닫히고 DELETED 연출 → 삭제
  //  · 아이폰은 브라우저가 진동을 지원하지 않아 진동만 빠짐
  var HOLD_MS = 3000;
  function holdTrash(btn, sheet, onDone) {
    var t0 = 0, raf = 0, buzz = 0, on = false;
    function set(p) {
      btn.style.setProperty("--hp", p.toFixed(3));
      sheet.style.setProperty("--hp", p.toFixed(3));
      sheet.style.setProperty("--amp", (p * p * 3.4).toFixed(2));          // 처음엔 살살, 끝으로 갈수록 세게
      btn.classList.toggle("hot", p > .45);
    }
    function stop() {
      on = false;
      cancelAnimationFrame(raf); clearInterval(buzz);
      btn.classList.remove("holding");
      sheet.classList.remove("shaking");
      set(0);
    }
    btn.addEventListener("pointerdown", function (e) {
      if (btn.disabled || on) return;
      e.preventDefault();
      try { btn.setPointerCapture(e.pointerId); } catch (x) {}
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // 키보드가 떠 있으면 내림
      on = true; t0 = performance.now();
      btn.classList.add("holding");
      sheet.classList.add("shaking");
      vib(12);
      buzz = setInterval(function () { vib(Math.round(10 + Math.min(1, (performance.now() - t0) / HOLD_MS) * 40)); }, 170);
      (function step() {
        var p = Math.min(1, (performance.now() - t0) / HOLD_MS);
        set(p);
        if (p >= 1) { stop(); vib([50, 40, 90]); onDone(); return; }
        raf = requestAnimationFrame(step);
      })();
    });
    function early() { if (!on) return; stop(); toast("휴지통을 3초 동안 꾹 누르고 있어야 삭제돼요"); }
    btn.addEventListener("pointerup", early);
    btn.addEventListener("pointercancel", early);
    btn.addEventListener("lostpointercapture", early);
    btn.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    btn.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toast("휴지통을 3초 동안 꾹 누르면 삭제돼요"); } });
  }
  // DELETED 연출: 화면 색이 빠지고 가운데에 DELETED 쾅 · 지울 카드는 덜덜 떨다 바스러짐 → 끝나면 done
  //  · 연출 동안(약 1.3초)은 화면을 눌러도 아무 일 없음
  function deletedFx(card, name, done) {
    if (SHEET_STILL) { done(); return; }
    var ov = document.createElement("div");
    ov.className = "wasted";
    ov.innerHTML = '<div class="wt"><b>DELETED</b>' + (name ? "<small>" + esc(name) + "</small>" : "") + "</div>";
    document.body.appendChild(ov);
    if (card) card.classList.add("deleting");
    setTimeout(function () { ov.classList.add("out"); }, 1000);
    setTimeout(function () { ov.remove(); done(); }, 1380);
  }
  holdTrash($("edDel"), $("sheetbg").querySelector(".sheet"), function () {
    var ed = state.edit;
    if (!ed || ed.mode !== "edit" || ed.killing) return;
    var orig = state.all.sched.filter(function (x) { return x.id === ed.id; })[0];
    if (orig && evPhase(orig) === "past") { toast("종료된 일정입니다."); closeSheet(); renderPage(); return; }
    ed.killing = true;
    var card = document.querySelector('#main [data-edit="' + ed.id + '"]');
    closeSheet();
    deletedFx(card, ed.old && ed.old.name, function () { state.edit = ed; submit("delete"); });
  });
  // 삭제 연출이 끝난 창을 바로 숨김 (접히는 효과 없이) — 다음에 열 때 깨끗한 상태로
  function killHide(bg, sh) {
    var hidden = flipSrc; flipSrc = null;
    if (hidden) hidden.style.visibility = "";                    // 곧 다시 그려지면서 사라짐 (실패하면 그대로 돌아옴)
    sh.style.transition = bg.style.transition = "none";
    bg.classList.remove("open", "flip");
    void bg.offsetWidth;
    if (bg.getAnimations) bg.getAnimations({ subtree: true }).forEach(function (x) { x.cancel(); });
    void bg.offsetWidth;
    sh.style.transition = bg.style.transition = "";
  }

  $("edName").addEventListener("keydown", function (e) { if (e.key === "Enter" && !$("edSave").disabled) submit(state.edit.mode); });
  $("edName").addEventListener("input", updateSaveState);

  function submit(mode) {
    var ed = state.edit;
    if (!ed) return;
    var name = $("edName").value.trim();
    // 시트에 저장되는 시각: UNTIL 이면 종료 칸의 시각, 아니면 시작 칸의 시각 (예전과 같은 형식)
    var st = ed.kind === "out" ? readEnd() : readStart();
    if (mode !== "delete") {
      if (!name) { toast("일정 명칭을 입력해 주세요"); return; }
      if (!st) { toast(ed.kind === "out" ? "종료 날짜와 시간을 골라 주세요" : "시작 날짜와 시간을 골라 주세요"); return; }
      if (ed.kind === "norm" && !(ed.len > 0)) { toast("종료 시간을 확인해 주세요"); return; }
    }
    // 창을 열어 둔 사이에 일정이 끝났으면 수정 · 삭제 불가
    if (mode === "edit" || mode === "delete") {
      var orig = state.all.sched.filter(function (x) { return x.id === ed.id; })[0];
      if (orig && evPhase(orig) === "past") { toast("종료된 일정입니다."); closeSheet(); renderPage(); return; }
    }
    // 지난 시간이 들어간 일정은 저장 불가 (진행 중인 일정은 원래 시작까지 허용)
    if (mode !== "delete") {
      var terr = timeErr(ed, st, ed.len);
      if (terr) { toast(terr); return; }
    }
    // 지속시간 칸: 보통 일정은 길이 표기, FROM/UNTIL 은 원래 적혀 있던 표기를 그대로 (바꿨으면 새 표기)
    var dur = ed.kind === "norm" ? fmtDur(ed.len) : (kindOf(ed.dur0) === ed.kind ? ed.dur0 : kindLabel(ed.kind));
    if (mode !== "delete") {
      var hit = findOverlap(st.key, st.min, dur, ed.id || 0);
      if (hit) { toast("겹치는 일정: " + hit); return; }
    }
    var req = {
      mode: mode, id: ed.id || 0, old: ed.old || null,
      date: st ? st.key : ed.date, name: name, start: st ? st.min : ed.start, dur: dur,
      mark: ed.kind === "norm" ? (ed.mark || "") : ""
    };
    // 빠르게: 서버 응답을 기다리지 않고 화면에 먼저 반영하고 창을 닫음
    //  · 서버가 끝나면 시트의 최신 내용으로 다시 맞춤
    //  · 실패하면 화면을 원래대로 되돌리고, 저장하려던 내용 그대로 창을 다시 열어 줌
    var snap = JSON.stringify(state.all.sched);
    applyLocalEvent(req);
    schedRev++;
    closeSheet();
    state.sig = "";                                       // 서버 결과가 오면 반드시 다시 그림 (대기중 표시가 남지 않게)
    renderTabs();
    renderPage();
    state.pending++;
    var my = ++state.seq;
    state.loading = false;
    google.script.run
      .withSuccessHandler(function (all) {
        state.pending--;
        if (my === state.seq) onAll(all, false);
        else { if (mode === "delete") { renderTabs(); renderPage(); } if (!state.pending) load(); }
        toast(mode === "delete" ? "삭제 완료" : "저장 완료");
      })
      .withFailureHandler(function (err) {
        state.pending--;
        state.all.sched = JSON.parse(snap);
        schedRev++;
        renderTabs();
        renderPage();
        toast(saveErr(err));
        if (mode !== "delete" && !state.edit && !state.memo && !/종료된 일정/.test(saveErr(err))) {
          openSheet({ mode: mode, id: req.id || undefined, old: req.old || undefined, date: req.date, start: req.start, name: req.name, dur: req.dur, mark: req.mark });
        }
      })
      .saveEvent(req);
  }
  // 화면의 일정 목록에 먼저 반영 (새 일정은 서버에서 행 번호를 받기 전까지 임시 번호)
  var tmpId = -1;
  function applyLocalEvent(r) {
    var list = state.all.sched;
    // 삭제: DELETED 연출이 끝났으니 화면에서 바로 지움 (서버가 실패하면 submit 이 원래대로 되돌림)
    if (r.mode === "delete") { state.all.sched = list.filter(function (x) { return x.id !== r.id; }); return; }
    var e = r.mode === "edit" ? list.filter(function (x) { return x.id === r.id; })[0] : null;
    if (!e) { e = { id: tmpId-- }; list.push(e); }
    e.date = r.date; e.name = r.name; e.start = r.start; e.noTime = false;
    e.dur = r.dur; e.len = durMin(r.dur); e.kind = kindOf(r.dur);
    e.mark = e.kind === "norm" ? (r.mark || "") : "";
    e.saving = true;                                     // 서버가 확인할 때까지 "저장 중" (서버 결과로 바뀌면 사라짐)
  }

  // [시작, 끝) 이 1분이라도 겹치면 그 일정 이름을 돌려줌 (FROM/UNTIL 은 1분짜리)
  function spanOf(key, start, dur) {
    var len = kindOf(dur) === "norm" ? durMin(dur) : 1;
    var s0 = keyMs(key) + start * 60000;
    return { s: s0, e: s0 + len * 60000 };
  }
  function findOverlap(key, start, dur, skipId) {
    var me = spanOf(key, start, dur), hit = "";
    state.all.sched.some(function (x) {
      if (x.id === skipId || x.noTime) return false;
      var o = spanOf(x.date, x.start, x.dur);
      if (o.s < me.e && me.s < o.e) { hit = x.name + " (" + fmtMinAmPm(x.start) + ")"; return true; }
      return false;
    });
    return hit;
  }

  // ---------- 메모 편집 ----------
  function openMemo(slot) {
    var m = state.all.memos.filter(function (x) { return x.date === state.view && x.slot === slot; })[0];
    state.memo = { date: state.view, slot: slot };
    var mp = dateParts(keyMs(state.view));
    state.memo.text0 = m ? m.text : "";
    $("mmTitle").textContent = m ? "메모 수정" : "메모 추가";
    $("mmSub").textContent = mp.y + ". " + mp.m + ". " + mp.d;
    $("mmSs").innerHTML = m ? "&nbsp;메모 수정 중.." : "";
    fixDigits($("mmSub").parentNode);
    $("mmText").value = state.memo.text0;
    $("mmDel").style.display = m ? "" : "none";
    setMemoBusy(false);
    $("memobg").classList.add("open");
    lockScroll(true);
  }
  function closeMemo() { $("memobg").classList.remove("open"); state.memo = null; lockScroll(false); }
  function setMemoBusy(b) { if (state.memo) state.memo.busy = b; $("mmDel").disabled = b; updateMemoSave(); }
  // 메모: 내용이 처음과 같으면 저장 버튼을 끔 (새 메모는 빈칸이면 끔)
  function updateMemoSave() {
    var mm = state.memo;
    if (!mm) return;
    $("mmSave").disabled = !!mm.busy || $("mmText").value.replace(/\s+$/, "") === mm.text0.replace(/\s+$/, "");
  }
  $("mmText").addEventListener("input", updateMemoSave);
  $("mmClose").onclick = closeMemo;
  $("memobg").addEventListener("click", function (e) { if (e.target === $("memobg")) closeMemo(); });
  $("mmSave").onclick = function () { if (!this.disabled) saveMemoText($("mmText").value); };
  holdTrash($("mmDel"), $("memobg").querySelector(".sheet"), function () {
    var mm = state.memo;
    if (!mm) return;
    var card = document.querySelector('#main [data-memo="' + mm.slot + '"]');
    closeMemo();
    deletedFx(card, "", function () { state.memo = mm; saveMemoText(""); });
  });

  // 메모도 화면에 먼저 반영하고 창을 닫음 (실패하면 되돌리고 적던 내용 그대로 다시 열어 줌)
  function saveMemoText(text) {
    var mm = state.memo;
    if (!mm) return;
    var snap = JSON.stringify(state.all.memos);
    var t = String(text || "").replace(/\s+$/, "");                 // 서버와 같은 규칙 (끝 공백 제거)
    var list = state.all.memos, m = list.filter(function (x) { return x.date === mm.date && x.slot === mm.slot; })[0];
    if (!t) state.all.memos = list.filter(function (x) { return x !== m; });
    else if (m) { m.text = t; m.saving = true; }
    else list.push({ id: -1, date: mm.date, slot: mm.slot, text: t, done: false, saving: true });
    closeMemo();
    state.sig = "";                                       // 서버 결과가 오면 반드시 다시 그림 ("저장 중" 이 남지 않게)
    renderPage();
    state.pending++;
    var my = ++state.seq;
    state.loading = false;
    google.script.run
      .withSuccessHandler(function (all) {
        state.pending--;
        if (my === state.seq) onAll(all, false); else if (!state.pending) load();
        toast(t ? "메모 저장 완료" : "메모 삭제 완료");
      })
      .withFailureHandler(function (err) {
        state.pending--;
        state.all.memos = JSON.parse(snap);
        renderPage();
        toast(saveErr(err));
        if (!state.edit && !state.memo && state.view === mm.date) { openMemo(mm.slot); $("mmText").value = text; }
      })
      .saveMemo({ date: mm.date, slot: mm.slot, text: text });
  }

  // ---------- 자동 갱신 ----------
  function canRefresh() { return document.visibilityState === "visible" && state.pending === 0 && !state.edit && !state.memo; }

  setInterval(function () { if (canRefresh()) load(); }, REFRESH_MS);
  // 분이 바뀌면 다시 그림 (서버 호출 없음): 현재 시각 선 · 진행 중/끝난 일정 · 달력 빗금
  //  · 자동 갱신은 바뀐 게 없으면 다시 그리지 않으므로, 시간에 따라 달라지는 표시는 여기서 맞춤
  setInterval(function () {
    if (!canRefresh() || !state.all) return;
    if (nowMin() === state.drawnMin && todayKey() === state.drawnDay) return;
    if (!validView(state.view)) { state.view = "TIMELINE"; renderTabs(); }
    else if (state.calOpen) renderCal();
    renderPage();
  }, 15000);
  document.addEventListener("visibilitychange", function () { if (canRefresh()) load(); });

  // 뒤로 가기 등으로 예전 화면이 그대로 되살아난 경우에도 TIMELINE 으로
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    closeSheet();
    closeMemo();
    state.view = "TIMELINE";
    state.calOpen = false;
    state.slide = null;
    window.scrollTo(0, 0);
    renderTabs();
    renderPage();
    load(true);
  });

  // ---------- 시작: 항상 TIMELINE + 저장된 데이터를 먼저 보여주고 바로 최신으로 갱신 ----------
  (function start() {
    state.view = "TIMELINE";
    state.heroDraw = true;
    window.scrollTo(0, 0);
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch (e) {}
    if (cached && cached.sched) { state.loading = true; onAll(cached, true); }
    else renderTabs();
    // 링크 끝에 #key=앱키 를 붙여 열면 키를 자동으로 저장 (주소창에서는 바로 지움)
    var hk = /[#&]key=([0-9a-f]{32})/i.exec(location.hash);
    if (hk) {
      try { localStorage.setItem(KEY_STORE, hk[1]); } catch (e) {}
      history.replaceState(null, "", location.pathname + location.search);
    }
    if (!apiReady() || !apiKey()) askKey("");
    load();
    checkTitleFont();
  })();

  // 설치형 앱: 화면 파일 · 글꼴을 기기에 저장해 두고 바로 열기 (sw.js)
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
